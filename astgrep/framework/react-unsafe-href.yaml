id: bpm-framework-react-unsafe-href
language: tsx
severity: warning
rule:
  any:
    # Case 1: href bound to a non-constant expression with no scheme
    # validation/sanitizer wrapper visible at the call site.
    - pattern:
        context: '<a href={$URL} />'
        selector: jsx_attribute
      not:
        any:
          - pattern:
              context: '<a href={$SAFE.sanitize($$$ARGS)} />'
              selector: jsx_attribute
          - pattern:
              context: '<a href={isSafeUrl($$$ARGS)} />'
              selector: jsx_attribute
    # Case 2: hardcoded javascript: scheme, plain string attribute.
    - pattern:
        context: '<a href="javascript:$$$REST" />'
        selector: jsx_attribute
    # Case 3: hardcoded javascript: scheme inside a JSX expression.
    - pattern:
        context: '<a href={"javascript:$$$REST"} />'
        selector: jsx_attribute
    # Case 4/5: same javascript: scheme footgun on iframe src (an
    # anchor's href only navigates on click; an iframe's src attribute
    # evaluates the URL immediately on render). img/script/audio src do
    # not execute javascript: URLs in modern browsers, so this is scoped
    # to iframe, the one other DOM-XSS-relevant src sink.
    - pattern:
        context: '<iframe src="javascript:$$$REST" />'
        selector: jsx_attribute
    - pattern:
        context: '<iframe src={"javascript:$$$REST"} />'
        selector: jsx_attribute
constraints:
  URL:
    not:
      kind: string
message: >
  A JSX href/src is assigned a non-constant value (or a hardcoded
  javascript: scheme) with no scheme validation (React/DOM framework
  knowledge, CWE-79 / CWE-601: Cross-Site Scripting via javascript: URL,
  Open Redirect). If the value is attacker-influenced (props, query
  params, CMS content), an attacker can supply `javascript:...` to
  execute script on click (href) or on render (iframe src), or redirect
  to an attacker-controlled origin. Validate the URL scheme (e.g. an
  `isSafeUrl()` allow-list of http/https/mailto) or run it through a
  sanitizer before assigning to href/src.
# Primary source: OWASP XSS Prevention Cheat Sheet (Rule #5, URL
# contexts) + DOM-based XSS guidance.
metadata:
  license: proprietary
  provenance: authored
  cwe: [79]
  owasp: "A03:2021"
  framework: react
  confidence: medium
  concept: input_validation
  since: "0.1.0"
