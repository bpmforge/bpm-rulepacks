id: bpm-framework-drizzle-sql-raw-injection
language: typescript
severity: warning
rule:
  pattern: sql.raw($X)
constraints:
  X:
    not:
      kind: string
message: >
  sql.raw() is called with a non-literal (dynamic) value (Drizzle ORM
  framework knowledge, CWE-89: SQL Injection). Unlike Drizzle's tagged
  `sql` template — which auto-parameterizes interpolated values —
  sql.raw() inserts its argument into the query verbatim, unescaped. If
  the value can carry attacker-controlled data, this is direct SQL
  injection. Use the parameterized `sql` tag (`` sql`... ${value} ...` ``)
  instead, or restrict sql.raw() to compile-time constants (e.g. a
  validated allow-list of column/direction names).
# Primary source: Drizzle ORM docs (sql operator, raw SQL) + OWASP SQL
# Injection Prevention Cheat Sheet.
metadata:
  license: proprietary
  provenance: authored
  cwe: [89]
  owasp: "A03:2021"
  framework: drizzle
  confidence: medium
  concept: sql_database
  since: "0.1.0"
