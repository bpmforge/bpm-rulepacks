id: bpm-framework-django-mark-safe-non-constant
language: python
severity: warning
rule:
  pattern: mark_safe($X)
constraints:
  X:
    not:
      kind: string
message: >
  mark_safe() is called on a non-constant value (Django framework
  knowledge, CWE-79: Cross-Site Scripting). mark_safe() tells Django's
  auto-escaping template engine to render the string verbatim, bypassing
  HTML escaping entirely. If the value can carry attacker-controlled data
  (request input, model fields populated from user submissions, query
  params), this is direct HTML/script injection. Escape the value with
  django.utils.html.escape() first, or restrict mark_safe() to compile-time
  string literals.
# Primary source: Django docs (django.utils.safestring.mark_safe) + OWASP
# XSS Prevention Cheat Sheet.
metadata:
  license: proprietary
  provenance: authored
  cwe: [79]
  owasp: "A03:2021"
  framework: django
  confidence: medium
  concept: input_validation
  since: "0.1.0"
