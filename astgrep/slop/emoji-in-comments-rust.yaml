# ast-grep rule — ANTI_SLOP R-16: emojis in code comments (Rust port).
# Structural (AST): Rust's tree-sitter grammar splits comments into two
# distinct kinds — `line_comment` (`//`, `///`, `//!`) and `block_comment`
# (`/* */`), unlike C/C#/Python/Swift where a single `comment` kind covers
# both (verified: `ast-grep scan --rule` with `kind: comment` on Rust source
# fails with "Kind `comment` is invalid" — Rust has no unified kind). Both
# are matched via `any` + a shared regex. An emoji in a source comment is
# always the antipattern regardless of context — a near-certain AI giveaway;
# emojis belong in commit messages or PR descriptions, never in source. No
# dataflow needed.
id: bpm-slop-emoji-in-comments-rust
language: rust
severity: warning
rule:
  any:
    - kind: line_comment
    - kind: block_comment
  regex: "[\\x{1F300}-\\x{1FAFF}\\x{2600}-\\x{27BF}\\x{2B00}-\\x{2BFF}]"
  # Rustdoc comments are excluded (2026-10-28, RepoPulse
  # docs/benchmarks/rule-grade-w22-07): all 16 axum hits were `///` and `//!`
  # docs using a warning sign or a feature-table check mark, a convention in a
  # human-written crate years older than code assistants. Plain `//` comments
  # still fire.
  not:
    regex: "^(///|//!|/\\*\\*|/\\*!)"
message: >
  emoji in source comment (ANTI_SLOP R-16) — emojis in code comments are a
  near-certain AI giveaway to experienced reviewers ("generated, not
  authored"). Remove it; emojis belong in commit messages or PR descriptions
  where the author intentionally placed them.
metadata:
  license: MIT
  provenance: "ported:bpm-opencode-experts/ANTI_SLOP_RULES R-16"
  cwe: [1078]
  confidence: high
  concept: code_quality
  since: "0.1.0"
