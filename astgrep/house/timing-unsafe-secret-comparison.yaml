id: bpm-house-timing-unsafe-secret-comparison
language: ts
severity: warning
message: >
  A secret is compared with a short-circuiting equality operator. String
  comparison in JavaScript returns as soon as it finds a differing byte, so how
  long the comparison takes leaks how many leading bytes were correct
  (CWE-208, observable timing discrepancy). An attacker who can measure request
  latency recovers the value one byte at a time instead of guessing it whole.
  Use a constant-time comparison — crypto.timingSafeEqual on equal-length
  buffers — for tokens, signatures, HMACs, and anything else an attacker
  submits and you check.
utils:
  secret-word:
    regex: "(?i)(token|secret|password|passwd|apikey|api_key|hmac|signature|digest|nonce|otp|bearer)"
  # Two fields of the SAME object compared to each other. That is an internal
  # consistency assertion, not verification of something a caller submitted —
  # no attacker controls either side, so there is no channel to time.
  same-receiver:
    any:
      - pattern: $O.$X === $O.$Y
      - pattern: $O.$X !== $O.$Y
      - pattern: $O.$X == $O.$Y
      - pattern: $O.$X != $O.$Y
  # The SAME property read off two different objects: a diff/equality check
  # between two records, not a credential check. Verification compares a
  # submitted value against a stored one, which almost never share an accessor.
  mirrored-property:
    any:
      - pattern: $L.$P === $R.$P
      - pattern: $L.$P !== $R.$P
      - pattern: $L.$P == $R.$P
      - pattern: $L.$P != $R.$P
  # Comparing lengths leaks the length, which is not the secret. This is format
  # validation (`tok.length === PREFIX.length + 64`), not a comparison of values.
  length-comparison:
    any:
      - has: { field: left, pattern: $X.length }
      - has: { field: right, pattern: $X.length }
  # `password === confirmPassword`. Both sides were typed by the same user into
  # the same form; nothing is being checked against a stored secret.
  confirmation-field:
    regex: "(?i)confirm"
rule:
  all:
    - any:
        - pattern: $A === $B
        - pattern: $A !== $B
        - pattern: $A == $B
        - pattern: $A != $B
    # A timing attack needs a secret on BOTH sides — the value the attacker
    # submitted and the value it is checked against. Requiring the vocabulary on
    # each operand, rather than anywhere in the expression, is what separates
    # `headerToken === expectedToken` from `s.signature.trim() !== s.name`,
    # where `signature` is a code symbol and `name` is not a secret at all.
    - has: { field: left, matches: secret-word }
    - has: { field: right, matches: secret-word }
    # Both operands must be runtime values. A literal, undefined, null or a
    # typeof result has no secret on the other side, so there is nothing for
    # a timing measurement to reveal.
    - not: { has: { kind: string, field: right } }
    - not: { has: { kind: string, field: left } }
    - not: { has: { kind: number, field: right } }
    - not: { has: { kind: unary_expression, stopBy: end } }
    - not: { matches: same-receiver }
    - not: { matches: mirrored-property }
    - not: { matches: length-comparison }
    - not: { matches: confirmation-field }
metadata:
  license: proprietary
  provenance: "derived:shipwright/SEC-02"
  cwe: [208]
  confidence: medium
  concept: cryptography
  domain: security
  since: "0.2.0"
  # From an LLM security review of shipwright (apps/server/src/auth-plugin.ts):
  # the shared bearer token is checked with `token !== opts.token`, on a route
  # an unauthenticated caller can hit repeatedly.
  #
  # PRECISION MEASURED TWICE, AND IT FAILED THE FIRST TIME.
  #
  # v1 shipped at ~0.12 precision — 1 real in 8 sampled of 36 raw hits — and it
  # was ALREADY a rejected-and-narrowed draft when it shipped. Sampling 8 of 36
  # is what let it through: the sample said "mostly literals and undefined
  # checks", the literal/undefined/null/typeof exclusions were added, and nobody
  # re-measured what survived them.
  #
  # v2 (this rule) was built by triaging ALL 13 surviving fleet hits by hand —
  # not a sample. 3 real, 10 noise: precision 0.23. Every one of the 10 fell into
  # a family a pattern CAN decide, which directly contradicts v1's own metadata
  # note that "same receiver is not reliably decidable here":
  #
  #   same-receiver        config.makerToken === config.reviewerToken     1
  #   mirrored-property    seq.identTokens === fan.identTokens            3
  #   length-comparison    tok.length === PREFIX.length + 64              2
  #   confirmation-field   password === confirmPassword                   3
  #   both-sides-secret    s.signature.trim() !== s.name                  1
  #
  # After: 3 hits on the same fleet, all 3 real. The kept ones are a bearer token
  # vs a configured secret (shipwright auth-plugin), a submitted API-token hash
  # vs the stored hash (threatforge auth middleware), and a webhook secret
  # (threatforge gitlab-client).
  #
  # The both-sides-secret requirement is the only change that is a semantic
  # tightening rather than an exclusion list, and it is the one worth reusing: a
  # genuine verification names BOTH operands, because both are the same secret.
  #
  # Not caught, and it would need dataflow: a secret compared through variables
  # whose names say nothing (`if (a !== b)` where both came from a token). The
  # naming convention does all the work in this rule.
