id: bpm-house-timing-unsafe-secret-comparison
language: ts
severity: warning
message: >
  A secret is compared with a short-circuiting equality operator. String
  comparison in JavaScript returns as soon as it finds a differing byte, so how
  long the comparison takes leaks how many leading bytes were correct
  (CWE-208, observable timing discrepancy). An attacker who can measure request
  latency recovers the value one byte at a time instead of guessing it whole.
  Use a constant-time comparison — crypto.timingSafeEqual on equal-length
  buffers — for tokens, signatures, HMACs, and anything else an attacker
  submits and you check.
rule:
  any:
    - all:
        - pattern: "$A === $B"
        - regex: "(?i)(token|secret|password|passwd|apikey|api_key|hmac|signature|digest|nonce|otp|bearer)"
        # Both operands must be runtime values. A literal, undefined, null or a
        # typeof result has no secret on the other side, so there is nothing for
        # a timing measurement to reveal.
        - not: { pattern: "$A === undefined" }
        - not: { pattern: "undefined === $B" }
        - not: { pattern: "$A === null" }
        - not: { pattern: "null === $B" }
        - not: { has: { kind: string, field: right } }
        - not: { has: { kind: string, field: left } }
        - not: { has: { kind: number, field: right } }
        - not: { has: { kind: unary_expression, stopBy: end } }
    - all:
        - pattern: "$A !== $B"
        - regex: "(?i)(token|secret|password|passwd|apikey|api_key|hmac|signature|digest|nonce|otp|bearer)"
        # Both operands must be runtime values. A literal, undefined, null or a
        # typeof result has no secret on the other side, so there is nothing for
        # a timing measurement to reveal.
        - not: { pattern: "$A !== undefined" }
        - not: { pattern: "undefined !== $B" }
        - not: { pattern: "$A !== null" }
        - not: { pattern: "null !== $B" }
        - not: { has: { kind: string, field: right } }
        - not: { has: { kind: string, field: left } }
        - not: { has: { kind: number, field: right } }
        - not: { has: { kind: unary_expression, stopBy: end } }
    - all:
        - pattern: "$A == $B"
        - regex: "(?i)(token|secret|password|passwd|apikey|api_key|hmac|signature|digest|nonce|otp|bearer)"
        # Both operands must be runtime values. A literal, undefined, null or a
        # typeof result has no secret on the other side, so there is nothing for
        # a timing measurement to reveal.
        - not: { pattern: "$A == undefined" }
        - not: { pattern: "undefined == $B" }
        - not: { pattern: "$A == null" }
        - not: { pattern: "null == $B" }
        - not: { has: { kind: string, field: right } }
        - not: { has: { kind: string, field: left } }
        - not: { has: { kind: number, field: right } }
        - not: { has: { kind: unary_expression, stopBy: end } }
    - all:
        - pattern: "$A != $B"
        - regex: "(?i)(token|secret|password|passwd|apikey|api_key|hmac|signature|digest|nonce|otp|bearer)"
        # Both operands must be runtime values. A literal, undefined, null or a
        # typeof result has no secret on the other side, so there is nothing for
        # a timing measurement to reveal.
        - not: { pattern: "$A != undefined" }
        - not: { pattern: "undefined != $B" }
        - not: { pattern: "$A != null" }
        - not: { pattern: "null != $B" }
        - not: { has: { kind: string, field: right } }
        - not: { has: { kind: string, field: left } }
        - not: { has: { kind: number, field: right } }
        - not: { has: { kind: unary_expression, stopBy: end } }
metadata:
  license: MIT
  provenance: "derived:shipwright/SEC-02"
  cwe: [208]
  confidence: medium
  concept: cryptography
  domain: security
  since: "0.2.0"
  # From an LLM security review of shipwright (apps/server/src/auth-plugin.ts):
  # the shared bearer token is checked with `token !== opts.token`, on a route
  # an unauthenticated caller can hit repeatedly.
  #
  # confidence: medium, and the reason is stated rather than hidden: the operand
  # NAME is the only signal available to a pattern. `hash === expectedHash` in a
  # cache-key check is not a security defect and this rule cannot tell it from
  # an HMAC verification. `digest` and `hash`-adjacent names are the likeliest
  # false positives; `hash` alone is deliberately EXCLUDED from the word list
  # for exactly that reason, while `hmac`, `signature` and `digest` are kept
  # because those names are near-exclusively cryptographic.
  #
  # PRECISION MEASURED BEFORE SHIPPING, and the first draft was rejected on it:
  # sampling 8 of shipwright's 36 raw hits found ONE real (token !== opts.token)
  # and seven noise — `!== undefined`, `typeof x === 'string'`, comparisons to
  # string literals. ~0.12 precision is the same unshippable ratio that made
  # mem-unsafe-string-functions useless. The literal/undefined/null/typeof
  # exclusions below are what a timing attack actually requires: BOTH operands
  # runtime values, because a literal has no secret on the other side.
  #
  # KNOWN FALSE-POSITIVE CLASS, measured and left in: comparing two fields of
  # the same object is usually validation, not verification. shipwright has
  #   config.makerToken === config.reviewerToken
  # which asserts two configured identities DIFFER — no attacker submits either
  # side, so there is no timing channel. Not excluded by pattern because
  # "same receiver" is not reliably decidable here and the volume is low enough
  # to triage: 2 shipwright, 12 threatforge, 4 lodestone, 0 elsewhere.
  #
  # Not caught, and it would need dataflow: a secret compared through a variable
  # whose name says nothing (`if (a !== b)` where both came from a token). The
  # naming convention is doing the work here.
