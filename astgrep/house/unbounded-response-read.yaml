id: bpm-house-unbounded-response-read
language: ts
severity: warning
message: >
  A network response body is read whole into memory with no size guard anywhere
  in the enclosing function. `.text()`, `.arrayBuffer()` and `.blob()`
  buffer the entire response — a hostile or merely large endpoint decides how
  much memory this process allocates, and the process dies before any of your
  own limits apply (CWE-400 / CWE-770). Check `content-length` against a cap
  before reading, or stream `res.body` and count bytes as they arrive.
rule:
  all:
    - pattern: "await $RES.$METHOD()"
    # .json() and .formData() are DELIBERATELY excluded. They were 220 of 316
    # hits on threatforge — overwhelmingly API clients reading their own
    # backend, where the response is not attacker-sized and the parser bounds
    # the shape. Neither motivating finding was JSON: quarry SEC-03 buffers
    # fetched HTML via .text(), lodestone SEC-05 reads a file. Keeping them
    # would have drowned the real class 3:1.
    - regex: "\\.(text|arrayBuffer|blob)\\(\\)$"
    # INBOUND request bodies are a real unbounded-read risk but a DIFFERENT one:
    # the client picks the size, the fix is a body-size limit at the framework or
    # proxy, and the message below ("a network response body") is simply false
    # about them. 12 of 51 fleet hits were `await req.text()` in Next.js route
    # handlers. Filed separately rather than described wrongly here.
    - not: { regex: "\\b(req|request)\\.(text|arrayBuffer|blob)\\(\\)$" }
    # The browser File API. The user picked the file off their own disk; no
    # remote endpoint decides the size, so the CWE-400 framing does not apply.
    - not: { regex: "\\b(file|dataOrOptions|sourceOrFile)\\.(text|arrayBuffer|blob)\\(\\)$" }
    # Reading a FAILED response to put in an error message. Technically unbounded,
    # but it is a universal idiom on the error path of a configured endpoint, and
    # at 13 of 51 hits it drowns the class this rule exists to find — the same
    # reason `.json()` was excluded when this rule shipped.
    - not:
        inside:
          kind: variable_declarator
          has: { field: name, regex: "(?i)error" }
    # The guard may be a content-length check, a named cap, or any limit
    # constant — the rule asks only whether the enclosing function shows SOME
    # awareness of size. A function that mentions none is the finding. This is
    # deliberately generous: a false negative (some idiosyncratic guard we do
    # not recognise) is much cheaper than telling someone their capped fetch is
    # unbounded.
    - inside:
        any:
          - { kind: function_declaration }
          - { kind: arrow_function }
          - { kind: method_definition }
          - { kind: function_expression }
        stopBy: end
        not:
          has:
            regex: "content-length|contentLength|MAX_BYTES|maxBytes|maxSize|sizeLimit|byteLimit|maxLength|truncat|\\blimit\\b"
            stopBy: end
metadata:
  license: proprietary
  provenance: "derived:quarry/SEC-03,lodestone/SEC-05"
  cwe: [400, 770]
  confidence: medium
  concept: input_validation
  domain: security
  since: "0.2.0"
  # The largest security cluster across three rounds of LLM review — quarry
  # SEC-03 (fetcher.ts reads the whole HTML body) and lodestone SEC-05 (no cap
  # before reading a matched file into memory).
  #
  # BOTH FINDINGS CAME WITH THEIR OWN ORACLE, which is why this was the first
  # security rule worth building: each repo already contains the correct version
  # of the same operation. quarry's bpm-pull.ts declares
  #   export const MAX_BYTES = 5 * 1024 * 1024;
  # and checks content-length against it before reading — while fetcher.ts, the
  # primary path, does not. The codebase already knows the right answer and one
  # site disagrees. That shape (sibling does it correctly) has now produced
  # three of the strongest rules in this pack.
  #
  # GRADED THE DAY AFTER IT SHIPPED, and it should not have shipped as written.
  #
  # It went out at 51 fleet hits with the note "still the noisiest security rule
  # in the pack". Classifying all 51 — not sampling — showed 31 of them were not
  # the class this rule describes at all:
  #
  #   INBOUND request body   await req.text() in a route handler       12
  #   local File API         await file.text() from a file picker       6
  #   error-path read        const error = await response.text()       13
  #   ------------------------------------------------------------------
  #   targeted class         outbound response, no size guard          20
  #
  # The first family is a correctness bug, not noise: the message says "a network
  # response body" and these are REQUEST bodies. It told ThreatForge that reading
  # its own API's inbound payload was an unbounded response read. Unbounded
  # inbound bodies ARE a real defect — client-controlled size, fixed with a body
  # limit at the framework or proxy — and they deserve their own rule with their
  # own message. NOT YET BUILT; do not widen this rule to cover them.
  #
  # After: 20 fleet hits, all in the targeted class. Volume was never the
  # problem — the rule was answering three different questions at once, and the
  # ".json() drowns it 3:1" narrowing done before shipping fixed the volume while
  # leaving the conflation untouched.
  #
  # Confidence stays medium: the guard check asks only whether the enclosing
  # FUNCTION mentions a size limit, so a cap applied one call up the stack still
  # reads as absent. The remaining 20 are also not all equal — quarry's four
  # fetch arbitrary web pages (the motivating class), while several others read
  # a configured first-party backend, where a hostile body implies a larger
  # compromise. Ranking within the 20 is not yet mechanized.
