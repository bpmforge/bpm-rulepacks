id: bpm-owasp-a07-hardcoded-secret-ruby
language: ruby
severity: warning
rule:
  pattern: $VAR = $VAL
  kind: assignment
constraints:
  VAR:
    regex: '(?i)(password|passwd|api[_-]?key|secret|token)'
  VAL:
    kind: string
    regex: '^.{8,}$'
message: >
  A variable or constant whose name signals a credential (password,
  api_key, secret, token) is assigned a literal string of 8+ characters
  (OWASP A07:2021, CWE-798: Use of Hard-coded Credentials). Anyone with
  source or repository access recovers the live credential, and it stays
  recoverable in git history even after the line is deleted. Move the
  value to ENV, Rails encrypted credentials (`Rails.application.credentials`),
  or a secrets manager, and rotate the exposed credential.
metadata:
  license: proprietary
  provenance: authored
  cwe: [798]
  owasp: "A07:2021"
  confidence: medium
  concept: secrets_config
  since: "0.1.0"
