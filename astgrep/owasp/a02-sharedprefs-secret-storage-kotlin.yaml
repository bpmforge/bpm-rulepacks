id: bpm-owasp-a02-sharedprefs-secret-storage-kotlin
language: kotlin
severity: warning
rule:
  pattern: $PREFS.edit().putString($KEY, $VAL)
constraints:
  KEY:
    regex: '^(?i)"(password|token|secret|api[_-]?key|auth)'
message: >
  A password/token/secret-shaped value is written to SharedPreferences via
  a chained edit().putString() call (OWASP A02:2021, CWE-312: Cleartext
  Storage of Sensitive Information). Standard SharedPreferences XML files
  are stored unencrypted under the app's data directory — readable on a
  rooted device, via an adb backup, or via a misconfigured
  content-provider export. Use EncryptedSharedPreferences (AndroidX
  Security) or the platform Keystore for anything credential-shaped.
metadata:
  license: proprietary
  provenance: authored
  cwe: [312]
  owasp: "A02:2021"
  confidence: medium
  concept: secrets_config
  since: "0.1.0"
