id: bpm-owasp-a02-weak-hash-csharp
language: cs
severity: warning
rule:
  any:
    - pattern: MD5.Create()
    - pattern: SHA1.Create()
    - pattern: new MD5CryptoServiceProvider()
    - pattern: new SHA1CryptoServiceProvider()
message: >
  A weak/broken hash algorithm (MD5 or SHA-1) is instantiated via
  MD5.Create()/SHA1.Create() or the legacy CryptoServiceProvider classes
  (OWASP A02:2021, CWE-327: Use of a Broken or Risky Cryptographic
  Algorithm / CWE-328: Use of Weak Hash). Both have practical collision
  attacks and must not be used for password hashing, digital signatures,
  or integrity checks. Use SHA-256 or better (SHA256.Create() /
  System.Security.Cryptography.SHA256) for integrity/signing, and
  bcrypt/argon2/PBKDF2 (never a bare digest) for password storage.
metadata:
  license: proprietary
  provenance: authored
  cwe: [327, 328]
  owasp: "A02:2021"
  confidence: high
  concept: cryptography
  since: "0.1.0"
