id: bpm-owasp-a07-hardcoded-jwt-secret
language: typescript
severity: warning
rule:
  any:
    - pattern: 'jwt.sign($PAYLOAD, $SECRET)'
    - pattern: 'jwt.sign($PAYLOAD, $SECRET, $$$OPTS)'
constraints:
  SECRET:
    kind: string
message: >
  jwt.sign() is called with a hardcoded string literal as the signing
  secret (OWASP A07:2021, CWE-798: Use of Hard-coded Credentials). Anyone
  with source access (including a public repo, a decompiled bundle, or a
  leaked backup) can forge valid tokens for any user. Load the secret from
  an environment variable or secrets manager with no literal fallback.
metadata:
  license: proprietary
  provenance: "ported:bpm-opencode-experts/OWASP_METHODOLOGY A07"
  cwe: [798]
  owasp: "A07:2021"
  confidence: high
  concept: secrets_config
  since: "0.1.0"
