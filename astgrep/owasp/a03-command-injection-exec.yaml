id: bpm-owasp-a03-command-injection-exec
language: typescript
severity: warning
rule:
  any:
    - pattern: child_process.exec($CMD)
    - pattern: exec($CMD)
  not:
    any:
      - pattern: child_process.exec("$LITERAL")
      - pattern: exec("$LITERAL")
message: >
  Shell command built from a non-literal expression is passed to exec(),
  which runs it through a shell (OWASP A03:2021, CWE-78: OS Command
  Injection). If any part of $CMD is user-controlled, an attacker can inject
  shell metacharacters. Use execFile()/spawn() with an argument array
  instead of a shell string, or strictly allowlist the input.
metadata:
  license: proprietary
  provenance: "ported:bpm-opencode-experts/OWASP_METHODOLOGY A03"
