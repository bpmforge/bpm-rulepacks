id: bpm-owasp-a03-sql-injection-csharp
language: cs
severity: warning
rule:
  any:
    - all:
        - pattern: new SqlCommand($ARG)
        - has: { kind: binary_expression, stopBy: end }
    - all:
        - pattern: new SqlCommand($ARG)
        - has: { kind: interpolated_string_expression, stopBy: end }
    - all:
        - pattern: new SqlCommand($ARG, $$$REST)
        - has: { kind: binary_expression, stopBy: end }
    - all:
        - pattern: new SqlCommand($ARG, $$$REST)
        - has: { kind: interpolated_string_expression, stopBy: end }
    - all:
        - pattern:
            context: '$CMD.CommandText = $ARG;'
            selector: assignment_expression
        - has: { kind: binary_expression, stopBy: end }
    - all:
        - pattern:
            context: '$CMD.CommandText = $ARG;'
            selector: assignment_expression
        - has: { kind: interpolated_string_expression, stopBy: end }
message: >
  A SqlCommand's query text is built via string concatenation (+) or a
  string-interpolated ($"...") expression instead of parameterized query
  text, either at the SqlCommand constructor or via a later CommandText
  assignment (OWASP A03:2021, CWE-89: SQL Injection). An attacker who
  controls a value folded into the query this way can alter its structure
  to read, modify, or delete data outside the intended scope. Use
  parameter placeholders (`@id`) plus `cmd.Parameters.AddWithValue(...)` /
  `cmd.Parameters.Add(...)` so ADO.NET sends the value out-of-band from the
  query text.
metadata:
  license: MIT
  provenance: authored
  cwe: [89]
  owasp: "A03:2021"
  confidence: high
  concept: sql_database
  since: "0.1.0"
