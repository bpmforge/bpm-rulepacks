id: bpm-owasp-a02-insecure-random-csharp
language: cs
severity: warning
rule:
  pattern:
    context: 'var $VAR = new Random().Next($$$ARGS).ToString();'
    selector: variable_declaration
constraints:
  VAR:
    regex: '(?i)(token|password|secret|otp|session[_a-z]*id|apikey|api_key|nonce|csrf)'
message: >
  A variable whose name signals a security-sensitive value (token, secret,
  session id, OTP, ...) is assigned from System.Random (OWASP A02:2021,
  CWE-330: Use of Insufficiently Random Values). System.Random is a
  deterministic PRNG seeded from the system clock, intended for
  simulations/games, not security tokens — its output is predictable to an
  attacker who can observe or brute-force nearby seed values. Use
  RandomNumberGenerator.GetBytes() (or
  RandomNumberGenerator.GetHexString()/GetString() in .NET 8+) for anything
  security-sensitive.
metadata:
  license: MIT
  provenance: authored
  cwe: [330]
  owasp: "A02:2021"
  confidence: medium
  concept: cryptography
  since: "0.1.0"
