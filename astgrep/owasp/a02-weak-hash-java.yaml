id: bpm-owasp-a02-weak-hash-java
language: java
severity: warning
rule:
  any:
    - pattern: $X.getInstance($ALG)
    - pattern: $X.getInstance($ALG, $$$REST)
constraints:
  ALG:
    regex: '^"(MD5|SHA1|SHA-1)"$'
  X:
    regex: 'MessageDigest'
message: >
  MessageDigest is instantiated with MD5 or SHA-1 (OWASP A02:2021, CWE-328:
  Use of Weak Hash / CWE-327: Use of a Broken or Risky Cryptographic
  Algorithm). Both are cryptographically broken for security use (practical
  collision attacks) and must not be used for password hashing, digital
  signatures, or integrity checks. Use SHA-256 or better for integrity/
  signing, and bcrypt/argon2 (never a bare digest) for password storage.
metadata:
  license: proprietary
  provenance: authored
  cwe: [327, 328]
  owasp: "A02:2021"
  confidence: high
  concept: cryptography
  since: "0.1.0"
