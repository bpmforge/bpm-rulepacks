id: bpm-owasp-a02-weak-cipher-java
language: java
severity: warning
rule:
  any:
    - pattern: $X.getInstance($ALG)
    - pattern: $X.getInstance($ALG, $$$REST)
constraints:
  ALG:
    regex: '^"(DES|DESede)(/|")'
  X:
    regex: 'Cipher'
message: >
  javax.crypto.Cipher is instantiated with DES or triple-DES (OWASP
  A02:2021, CWE-327: Use of a Broken or Risky Cryptographic Algorithm). DES's
  56-bit effective key is brute-forceable and DESede/ECB mode leaks plaintext
  block patterns. Use AES-256/GCM instead, and never ECB mode for any cipher.
metadata:
  license: proprietary
  provenance: authored
  cwe: [327]
  owasp: "A02:2021"
  confidence: high
  concept: cryptography
  since: "0.1.0"
