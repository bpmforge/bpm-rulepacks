id: bpm-owasp-a02-insecure-random-php
language: php
severity: warning
rule:
  any:
    - pattern: rand()
    - pattern: mt_rand()
message: >
  rand()/mt_rand() are non-cryptographic PRNGs (a linear congruential
  generator and a Mersenne Twister, respectively) called with no
  arguments — the classic shape used to seed a token, password-reset
  code, or session identifier (OWASP A02:2021, CWE-330: Use of
  Insufficiently Random Values). Both are predictable from a handful of
  observed outputs. Use random_bytes()/random_int() (CSPRNG-backed,
  available since PHP 7) for anything security-sensitive.
metadata:
  license: proprietary
  provenance: authored
  cwe: [330]
  owasp: "A02:2021"
  confidence: medium
  concept: cryptography
  since: "0.1.0"
