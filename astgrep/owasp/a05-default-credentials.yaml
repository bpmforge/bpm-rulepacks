id: bpm-owasp-a05-default-credentials
language: typescript
severity: warning
rule:
  any:
    - pattern: '{ username: "admin", password: "admin", $$$REST }'
    - pattern: '{ $$$REST, username: "admin", password: "admin" }'
    - pattern: '{ username: "admin", password: "admin" }'
message: >
  Well-known default credentials ("admin"/"admin") are seeded/hardcoded
  (OWASP A05:2021, CWE-1188: Insecure Default Initialization of Resource).
  Shipping a default account with a known password is a standing backdoor
  until an operator remembers to change it. Generate a random password on
  first boot and force a reset, or require it from a required env var with
  no fallback.
metadata:
  license: proprietary
  provenance: "ported:bpm-opencode-experts/OWASP_METHODOLOGY A05"
  cwe: [1188]
  owasp: "A05:2021"
  confidence: medium
  concept: secrets_config
  since: "0.1.0"
