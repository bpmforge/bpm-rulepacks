id: bpm-owasp-a02-insecure-random-java
language: java
severity: warning
rule:
  any:
    - pattern: new java.util.Random($$$ARGS)
    - pattern: new Random($$$ARGS)
message: >
  java.util.Random is a non-cryptographic PRNG (Java's public LCG algorithm)
  used where a security-sensitive value is generated (OWASP A02:2021,
  CWE-330: Use of Insufficiently Random Values). Its output is predictable
  from a handful of observed values, which breaks any token, session key, or
  "remember me" cookie derived from it. Use java.security.SecureRandom for
  anything security-sensitive.
metadata:
