id: bpm-owasp-a07-hardcoded-secret-swift
language: swift
severity: warning
rule:
  all:
    - kind: property_declaration
    - has:
        field: name
        pattern: $VAR
    - has:
        field: value
        kind: line_string_literal
        pattern: $VAL
constraints:
  VAR:
    regex: '(?i)(password|passwd|api[_-]?key|secret|token)'
  VAL:
    regex: '^.{10,}$'
message: >
  A property whose name signals a credential (password, apiKey, secret,
  token) is initialized with a literal string of 10+ characters (OWASP
  A07:2021, CWE-798: Use of Hard-coded Credentials). Anyone with source or
  a decompiled-binary/IPA strings dump recovers the live credential, and it
  stays recoverable in git history even after the line is deleted. Load the
  value from the Keychain, an xcconfig-injected build setting, or a remote
  secrets manager, and rotate the exposed credential.
metadata:
  license: proprietary
  provenance: authored
  cwe: [798]
  owasp: "A07:2021"
  confidence: medium
  concept: secrets_config
  since: "0.1.0"
