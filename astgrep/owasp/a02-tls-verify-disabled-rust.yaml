# ast-grep rule — TLS certificate verification disabled in Rust.
# Structural: reqwest's ClientBuilder::danger_accept_invalid_certs(true) is
# always the antipattern regardless of context — the method's own "danger_"
# prefix is reqwest's own naming convention warning callers off it.
id: bpm-owasp-a02-tls-verify-disabled-rust
language: rust
severity: warning
rule:
  pattern: $BUILDER.danger_accept_invalid_certs(true)
message: >
  reqwest::ClientBuilder is constructed with
  danger_accept_invalid_certs(true) (OWASP A02:2021, CWE-295: Improper
  Certificate Validation). This disables both hostname verification and
  chain-of-trust validation for every request the client makes, allowing a
  man-in-the-middle attacker to present any certificate (including a
  self-signed one) undetected. Remove this option; fix the underlying
  certificate/CA problem (e.g. add the private CA to a custom
  `Certificate`/root store via `.add_root_certificate()`) instead of
  bypassing validation.
metadata:
  license: proprietary
  provenance: authored
  cwe: [295]
  owasp: "A02:2021"
  confidence: high
  concept: cryptography
  since: "0.1.0"
