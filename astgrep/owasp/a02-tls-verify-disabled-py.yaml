id: bpm-owasp-a02-tls-verify-disabled-py
language: python
severity: warning
rule:
  any:
    - pattern: requests.get($$$ARGS, verify=False, $$$REST)
    - pattern: requests.post($$$ARGS, verify=False, $$$REST)
    - pattern: requests.request($$$ARGS, verify=False, $$$REST)
    - pattern: $SESSION.verify = False
message: >
  TLS certificate verification is explicitly disabled (verify=False),
  allowing man-in-the-middle attacks against this connection (OWASP
  A02:2021, CWE-295: Improper Certificate Validation). Remove this option;
  fix the underlying certificate/CA problem instead of bypassing validation.
metadata:
  license: MIT
  provenance: "ported:bpm-opencode-experts/OWASP_METHODOLOGY A02"
  cwe: [295]
  owasp: "A02:2021"
  confidence: high
  concept: cryptography
  since: "0.1.0"
