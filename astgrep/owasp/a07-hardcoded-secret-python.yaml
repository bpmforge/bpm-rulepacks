id: bpm-owasp-a07-hardcoded-secret-python
language: python
severity: warning
rule:
  pattern: $VAR = $VAL
  kind: assignment
constraints:
  VAR:
    regex: '(?i)(password|passwd|api[_-]?key|secret|token)'
  VAL:
    kind: string
    regex: '^.{8,}$'
    # Narrowed 2026-10-28 after grading saleor (RepoPulse
    # docs/benchmarks/rule-grade-w22-07): 48 of 48 hits were constants named
    # after a credential whose value is a label. A value shaped like an
    # identifier (snake_case or camelCase letters, no digits), a sentence, a
    # file name or a dotted import path is not a credential; a key or a
    # password has digits, symbols or randomness, so those still fire.
    not:
      any:
        - regex: '^[rbuRBU]?["''][A-Za-z][A-Za-z_]*["'']$'
        - regex: '\s'
        - regex: '\.(html|txt|json|ya?ml|md)["'']$'
        - regex: '^["''][A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*){2,}["'']$'
message: >
  A variable or constant whose name signals a credential (password,
  api_key, secret, token) is assigned a literal string of 8+ characters
  (OWASP A07:2021, CWE-798: Use of Hard-coded Credentials). Anyone with
  source or repository access recovers the live credential, and it stays
  recoverable in git history even after the line is deleted. Move the
  value to an environment variable (os.environ / os.getenv with no
  literal fallback) or a secrets manager, and rotate the exposed
  credential.
metadata:
  license: MIT
  provenance: authored
  cwe: [798]
  owasp: "A07:2021"
  confidence: medium
  concept: secrets_config
  since: "0.1.0"
