id: bpm-owasp-a02-weak-cipher-swift
language: swift
severity: warning
rule:
  any:
    - pattern: CCAlgorithm(kCCAlgorithmDES)
    - pattern: CCAlgorithm(kCCAlgorithm3DES)
    - pattern: CCOptions(kCCOptionECBMode)
message: >
  CommonCrypto CCCrypt is configured with a DES/3DES algorithm or ECB block
  mode (OWASP A02:2021, CWE-327: Use of a Broken or Risky Cryptographic
  Algorithm). DES/3DES have a key size and block size too small for modern
  brute-force/meet-in-the-middle attacks, and ECB mode leaks plaintext
  patterns because identical plaintext blocks always encrypt to identical
  ciphertext blocks. Use AES-256 in GCM mode (kCCAlgorithmAES with a
  authenticated mode, or CryptoKit's AES.GCM) instead.
metadata:
  license: proprietary
  provenance: authored
  cwe: [327]
  owasp: "A02:2021"
  confidence: high
  concept: cryptography
  since: "0.1.0"
