id: bpm-owasp-a02-insecure-random-ruby
language: ruby
severity: warning
rule:
  any:
    - pattern: $VAR = rand($$$ARGS)
    - pattern: $VAR = Random.new.rand($$$ARGS)
    - pattern: $VAR = Random.rand($$$ARGS)
constraints:
  VAR:
    regex: '(?i)(token|password|secret|otp|session[_a-z]*id|apikey|api_key|nonce|csrf)'
message: >
  A variable whose name signals a security-sensitive value (token,
  secret, session id, OTP, ...) is assigned from Kernel#rand or
  Random#rand (OWASP A02:2021, CWE-330: Use of Insufficiently Random
  Values). Both are Mersenne Twister PRNGs seeded for statistical
  distribution, not unpredictability — their output is reconstructible
  from a handful of observed values. Use SecureRandom (hex, urlsafe_base64,
  random_number) for anything security-sensitive; it is CSPRNG-backed.
metadata:
  license: proprietary
  provenance: authored
  cwe: [330]
  owasp: "A02:2021"
  confidence: medium
  concept: cryptography
  since: "0.1.0"
