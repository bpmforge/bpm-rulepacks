rules:
  - id: bpm-owasp-a03-sql-string-concat
    languages: [javascript, typescript]
    severity: WARNING
    message: >
      SQL query is built via string concatenation / template interpolation
      instead of parameter placeholders (OWASP A03:2021, CWE-89: SQL Injection).
      Use a parameterized query (e.g. `db.query("... WHERE id = $1", [id])`)
      so the driver escapes the value.
    pattern-either:
      - pattern: |
          $DB.query(`...${$VAR}...`)
      - pattern: $DB.query($SQL + $VAR)
      - pattern: |
          $DB.execute(`...${$VAR}...`)
    metadata:
      license: proprietary
      provenance: "ported:bpm-opencode-experts/OWASP_METHODOLOGY A03"
      cwe: [89]
      owasp: "A03:2021"
      confidence: high
      concept: sql_database
      since: "0.1.0"
